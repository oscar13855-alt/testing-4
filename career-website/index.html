<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生涯規劃 | 陳老師</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .hero { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
  </style>
</head>
<body class="bg-gray-50">

  <!-- 導航欄 -->
  <nav class="bg-white shadow-md py-4">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-700">生涯規劃教室</h1>
      <div class="space-x-6">
        <a href="index.html" class="hover:text-indigo-600">首頁</a>
        <a href="student.html" class="hover:text-indigo-600">學生表現</a>
        <a href="parent.html" class="hover:text-indigo-600">家長分享</a>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="hero text-white py-20">
    <div class="max-w-6xl mx-auto px-6 text-center">
      <h2 class="text-5xl font-bold mb-4">幫助學生找到未來方向</h2>
      <p class="text-xl">專業生涯規劃 × 個性化輔導</p>
    </div>
  </header>

  <!-- 兩個主要格子 -->
  <div class="max-w-6xl mx-auto px-6 py-12">
    <div class="grid md:grid-cols-2 gap-8">
      <!-- 原有的兩個卡片保持不變... -->
      <!-- （這裡保留你原本的學生表現和家長分享卡片） -->

      <!-- 新增：個人資料卡片 -->
      <div onclick="checkAccess()" class="group cursor-pointer">
        <div class="bg-white rounded-2xl shadow-lg overflow-hidden hover:shadow-2xl transition-all duration-300 h-full">
          <div class="h-64 bg-gradient-to-br from-amber-500 to-orange-500 flex items-center justify-center">
            <i class="fa-solid fa-user-lock text-8xl text-white/80"></i>
          </div>
          <div class="p-8">
            <h3 class="text-3xl font-bold mb-3 text-gray-800">個人資料</h3>
            <p class="text-gray-600 leading-relaxed">僅限 ebenezer.org.hk 帳戶查看學生個人生涯檔案</p>
            <div class="mt-6 inline-flex items-center text-indigo-600 font-medium">
              立即進入 <i class="fa-solid fa-arrow-right ml-1"></i>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    function checkAccess() {
      const email = prompt("請輸入您的 Email（必須是 @ebenezer.org.hk）:");
      
      if (email && email.toLowerCase().endsWith("@ebenezer.org.hk")) {
        alert("驗證成功！正在進入個人資料頁...");
        window.location.href = "personal.html";
      } else {
        alert("❌ 只有 @ebenezer.org.hk 的帳戶才能進入此頁面");
      }
    }
  </script>

  <footer class="bg-gray-900 text-white py-8 text-center">
    <p>© 2026 陳老師生涯規劃工作室</p>
  </footer>
</body>
</html>
