<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個人資料 - 生涯規劃</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-gray-50">

  <nav class="bg-white shadow-md py-4">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">

      <a href="index.html" class="text-indigo-600 hover:underline">← 返回首頁</a>

  </nav>

  <div class="max-w-6xl mx-auto px-6 py-12">
    <h2 class="text-4xl font-bold text-center mb-10">學生個人資料</h2>
    
    <div class="bg-white rounded-2xl shadow p-10">
      <p class="text-center text-gray-500 mb-8">這裡放置每位學生的個人生涯檔案、測驗結果、諮詢記錄等</p>
      
      <!-- 你之後可以放表格或卡片 -->
      <div class="grid md:grid-cols-2 gap-6">
        <div class="border rounded-xl p-6">
          <h3 class="font-bold">學生姓名：李小明</h3>
          <p>生涯測評分數：92</p>
          <p>推薦方向：資工 / 數據科學</p>
        </div>
        <!-- 更多學生卡片... -->
      </div>
    </div>
  </div>
