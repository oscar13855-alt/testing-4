<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>學生表現 - 生涯規劃</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }
    .modal img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .close {
      position: absolute;
      top: 20px;
      right: 30px;
      color: white;
      font-size: 40px;
      cursor: pointer;
    }
  </style>
</head>
<body class="bg-gray-50">

  <nav class="bg-white shadow-md py-4">
    <div class="max-w-6xl mx-auto px-6 flex justify-between items-center">
      <h1 class="text-2xl font-bold text-indigo-700">生涯規劃教室</h1>
      <div class="space-x-6">
        <a href="index.html" class="hover:text-indigo-600">首頁</a>
        <a href="student.html" class="text-indigo-600 font-bold">學生表現</a>
        <a href="parent.html" class="hover:text-indigo-600">家長分享</a>
      </div>
    </div>
  </nav>

  <div class="max-w-6xl mx-auto px-6 py-12">
    <h2 class="text-4xl font-bold text-center mb-12">學生表現成果</h2>

    <!-- 兩張圖片並排 -->
    <div class="grid md:grid-cols-2 gap-10 max-w-4xl mx-auto">

      <!-- 左邊：學生 XXX -->
      <div class="text-center">
        <img src="assets/images/test 1.jpg" 
             alt="學生 XXX 生涯表現" 
             class="w-full rounded-2xl shadow-md cursor-pointer hover:brightness-90 transition-all"
             onclick="showImage(this)">
        <p class="mt-5 text-2xl font-semibold text-gray-800">學生 XXX</p>
      </div>

      <!-- 右邊：學生 YYY -->
      <div class="text-center">
        <img src="assets/images/test 1.jpg" 
             alt="學生 YYY 生涯表現" 
             class="w-full rounded-2xl shadow-md cursor-pointer hover:brightness-90 transition-all"
             onclick="showImage(this)">
        <p class="mt-5 text-2xl font-semibold text-gray-800">學生 YYY</p>
      </div>

    </div>
  </div>

  <!-- 放大圖片燈箱 -->
  <div id="imageModal" class="modal">
    <span class="close" onclick="closeModal()">×</span>
    <img id="modalImage" src="" alt="放大圖片">
  </div>

  <script>
    function showImage(imgElement) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImage');
      modalImg.src = imgElement.src;
      modal.style.display = 'flex';
    }

    function closeModal() {
      const modal = document.getElementById('imageModal');
      modal.style.display = 'none';
    }

    // 點擊背景關閉
    document.getElementById('imageModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });

    // ESC 鍵關閉
    document.addEventListener('keydown', function(e) {
      if (e.key === "Escape") closeModal();
    });
  </script>

</body>
</html>
